<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>اتفاقية تقديم خدمات تصميم | رنان لخدمات التصميم</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#101965">
    <link rel="icon" type="image/svg+xml" href="images/ranan-logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/agreement.css?v=1">
</head>

<body>
    <script src="js/icons.js?v=2"></script>

    <div class="ag-bar" id="ag-bar">
        <div class="in">
            <img src="images/ranan-logo.svg" alt="رنان" class="logo">
            <span class="hint">للحفظ بصيغة PDF اختر «حفظ بتنسيق PDF» من نافذة الطباعة.</span>
            <span class="grow"></span>
            <a class="btn ghost" id="ag-offer" href="#" hidden><svg class="icon"><use href="#i-chevron-right"/></svg><span>العرض</span></a>
            <button type="button" class="btn primary" id="ag-print" disabled><svg class="icon"><use href="#i-printer"/></svg><span>طباعة / حفظ PDF</span></button>
        </div>
    </div>

    <main class="ag-desk">
        <article class="sheet" id="ag-doc">
            <p class="ag-empty">جاري تحميل الاتفاقية...</p>
        </article>
    </main>

    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script defer src="js/firebase-init.js?v=2"></script>
    <script defer src="js/rnan-core.js?v=2"></script>
    <script defer src="js/agreement.js?v=1"></script>
</body>

</html>
